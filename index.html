<link rel="icon" href="/favicon.ico" sizes="48x48" /><link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" /><link rel="apple-touch-icon" href="/apple-touch-icon.png" />

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400&family=Poppins:wght@200;300;400&display=swap" rel="stylesheet" />

<style>
  :root{
    --white:#ffffff;
    --line:rgba(255,255,255,.33);
    --pill:rgba(255,255,255,.3);
    --cream-text:rgb(241,233,230);
    --gutter:56px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#1c1512}
  body{font-family:'Poppins',sans-serif;color:var(--white);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}

  /* ── Header (measured from the reference at 1920×1080) ── */
  .site-header{position:fixed;top:0;left:0;right:0;height:84px;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 var(--gutter)}
  .site-header::after{content:"";position:absolute;left:0;top:100%;width:100%;height:1px;background:var(--line);transform:scaleX(0);transform-origin:left center;transition:transform 2.6s cubic-bezier(.65,0,.35,1) .6s}
  .is-ready .site-header::after{transform:scaleX(1)}
  .logo img{display:block;height:68px;width:auto}
  .header-right{display:flex;align-items:center}
  .btn-pill{display:inline-flex;align-items:center;height:48px;padding:12px 30px;border-radius:1000px;background:var(--pill);border:.8px solid transparent;font-size:14px;font-weight:300;letter-spacing:.21px;line-height:22px;transition:background .3s ease}
  .btn-pill:hover{background:rgba(255,255,255,.45)}
  .header-divider{width:1px;height:18px;background:var(--white);margin:0 34px}
  .burger{display:block;width:93px;height:20px;margin-top:-6px;background:none;border:0;cursor:pointer;padding:0}
  .burger svg{display:block}

  /* Burger <-> close icon (lines slide out right, X fades in) */
  .burger{position:relative;overflow:hidden}
  .burger .ico-lines{transition:transform .6s cubic-bezier(.65,0,.35,1)}
  .burger .ico-x{position:absolute;right:calc(50% - 13.5px);top:-4px;width:27px;height:27px;opacity:0;transform:scale(.6);transition:opacity .4s ease,transform .6s cubic-bezier(.65,0,.35,1)}
  .menu-open .burger .ico-lines{transform:translateX(100%)}
  .menu-open .burger .ico-x{opacity:1;transform:none;transition-delay:.25s}
  .logo{position:relative}
  .logo .logo-dark{position:absolute;inset:0;opacity:0;transition:opacity .5s ease}
  .logo .logo-light{transition:opacity .5s ease}
  .menu-open .logo .logo-dark{opacity:1;transition-delay:.35s}
  .menu-open .logo .logo-light{opacity:0;transition-delay:.35s}
  .menu-open .site-header::after{opacity:0;transition:opacity .3s}

  /* ── Full-screen menu (measured from the reference at 1920×1080) ── */
  .menu{position:fixed;inset:0;z-index:40;display:grid;grid-template-columns:55.54% 1fr;background:rgb(241,233,230);clip-path:polygon(0% 0%,100% 0%,100% 0%,0% 0%);visibility:hidden}
  .menu-list-wrap{display:flex;align-items:center;min-height:100%;overflow-y:auto}
  .menu-list{list-style:none;width:100%;counter-reset:menu-counter}
  .menu-list > li{position:relative;padding:24px 0 26px 20%;border-bottom:.8px solid rgb(184,184,184);overflow:hidden}
  .menu-list > li::before{counter-increment:menu-counter;content:"(" counter(menu-counter) ") ";position:absolute;transform:translateX(calc(-100% - 5px)) translateY(-5px);font-family:Manrope,sans-serif;font-size:14px;color:rgb(39,39,39)}
  .menu-list > li > a,.menu-list > li > button{display:flex;align-items:center;gap:30px;font:200 50px/34px 'Poppins',sans-serif;color:rgb(39,39,39);background:none;border:0;padding:0;cursor:pointer;text-align:left}
  .menu-list a:focus,.menu-list button:focus{outline:none}
  .menu-list a:focus-visible,.menu-list button:focus-visible{outline:1px solid rgb(39,39,39);outline-offset:6px}
  .menu-list .chev{width:23px;height:13px;margin-top:.2em;transition:transform .2s;transform-origin:center}
  .menu-list button[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .sub-wrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s}
  .sub-wrap.open{grid-template-rows:1fr}
  .sub-menu{list-style:none;min-height:0;overflow:hidden}
  .sub-menu li{margin-bottom:16px;padding-left:8px}
  .sub-menu li:first-child{margin-top:24px}
  .sub-menu a{font:200 18px/20px 'Poppins',sans-serif;color:rgb(51,55,61)}
  /* Photo: Dominique Rivas on Unsplash */
  .menu-side{background:url('assets/img/menu-side.jpg') center 30%/cover no-repeat;clip-path:polygon(0% 100%,100% 100%,100% 100%,0% 100%)}

  @media (max-width:1024px){
    .menu-list > li{padding-left:10%}
    .menu-list > li > a,.menu-list > li > button{gap:18px}
    .menu-list a:focus,.menu-list button:focus{outline:none}
  .menu-list a:focus-visible,.menu-list button:focus-visible{outline:1px solid rgb(39,39,39);outline-offset:6px}
  .menu-list .chev{width:20px;height:11px}
  }
  @media (max-width:767px){
    .menu{grid-template-columns:1fr}
    .menu-side{display:none}
    .menu-list-wrap{padding-top:100px}
    .menu-list > li{padding-left:48px}
    .menu-list > li > a,.menu-list > li > button{font-size:36px;line-height:28px}
    .menu-open .burger .ico-x rect{fill:#272727}
    .menu-open .btn-pill{background:rgba(39,39,39,.12);color:#272727}
    .menu-open .header-divider{background:#272727}
  }

  /* ── Hero: pinned while the sunlight scrubs in on scroll ── */
  .hero{position:relative;height:300vh}
  .hero-stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
  .hero-video,.hero-poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .hero-scrim{position:absolute;inset:0;background:
      radial-gradient(ellipse 70% 60% at 50% 48%, rgba(20,14,10,.32) 0%, rgba(20,14,10,.12) 70%),
      linear-gradient(180deg, rgba(20,14,10,.38) 0%, rgba(20,14,10,.08) 30%, rgba(20,14,10,.12) 70%, rgba(20,14,10,.45) 100%)}

  .hero-copy{position:absolute;left:50%;top:236px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 2*var(--gutter))}
  .hero-title{font-size:150px;font-weight:200;line-height:118.5px;letter-spacing:normal}
  .hero-title span{display:block}
  .hero-sub{margin-top:23px;font-size:34px;font-weight:200;line-height:34px}

  .hero-tagline{position:absolute;left:var(--gutter);bottom:56px;width:244px;font-size:15px;font-weight:300;line-height:16px;letter-spacing:.21px;color:var(--cream-text)}

  .blob-btn{position:absolute;right:calc(var(--gutter) + 18px);bottom:72px;width:150px;height:150px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:300;letter-spacing:.21px;text-transform:uppercase}
  .blob-btn .blob{position:absolute;inset:-17.5px;border:.8px solid var(--white);border-radius:40% 60% 70% 30% / 40% 40% 60% 50%;pointer-events:none;will-change:transform,border-radius}

  /* Load-in: copy rises in once the page is ready */
  .reveal{opacity:0;transform:translateY(40px);filter:blur(8px);transition:opacity 2.6s cubic-bezier(.16,1,.3,1),transform 2.8s cubic-bezier(.16,1,.3,1),filter 2.4s cubic-bezier(.16,1,.3,1)}
  .is-ready .reveal{opacity:1;transform:none;filter:none}
  .is-ready .reveal{transition-delay:.3s}
  .is-ready .reveal.d1{transition-delay:.7s}
  .is-ready .reveal.d2{transition-delay:1.9s}
  .is-ready .reveal.d3{transition-delay:2.5s}
  .is-ready .reveal.d4{transition-delay:2.9s}
  @media (prefers-reduced-motion:reduce){.reveal,.site-header::after{transition:none}}

  /* ── Smaller screens: same layout, scaled ── */
  @media (max-width:1440px){
    .hero-copy{top:clamp(150px,16.4vh,236px)}
    .hero-title{font-size:clamp(64px,7.8vw,150px);line-height:.79em}
    .hero-sub{font-size:clamp(18px,1.77vw,34px);line-height:1;margin-top:clamp(14px,1.2vw,23px)}
  }
  @media (max-width:767px){
    :root{--gutter:20px}
    .site-header{height:72px}
    .logo img{height:52px}
    .btn-pill{height:40px;padding:8px 20px}
    .header-divider{margin:0 16px}
    .burger,.burger svg{width:56px}
    .hero-copy{top:auto;bottom:250px;left:var(--gutter);transform:none;width:auto}
    .hero-title{font-size:clamp(56px,17vw,80px)}
    .hero-sub{font-size:18px}
    .hero-tagline{display:none}
    .hero-video,.hero-poster{object-position:68% 50%}
    .blob-btn{width:110px;height:110px;right:calc(var(--gutter) + 14px);bottom:56px}
  }
</style>
</head>
<body>

<header class="site-header">
  <a href="/" class="logo reveal" aria-label="Aurelia Med Spa home"><img class="logo-light" src="assets/brand/logo-white.png" alt="Aurelia Med Spa" width="96" height="52" /><img class="logo-dark" src="assets/brand/logo-dark.png" alt="" aria-hidden="true" width="96" height="52" /></a>

  <section class="hero" id="hero" aria-label="Aurelia Med Spa">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js"></script>
<script>
(function () {
  gsap.registerPlugin(ScrollTrigger);
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  requestAnimationFrame(function () { document.documentElement.classList.add('is-ready'); });

  /* Smooth scroll, wired into ScrollTrigger */
  if (!reduce) {
    var lenis = window.lenis = new Lenis({ lerp: 0.09 });
    lenis.on('scroll', ScrollTrigger.update);
    gsap.ticker.add(function (t) { lenis.raf(t * 1000); });
    gsap.ticker.lagSmoothing(0);
  }

  /* Blob button: slow rotation + organic morph, like the reference */
  var blob = document.querySelector('.blob');
  if (!reduce) {
    gsap.to(blob, { rotation: 360, duration: 9, ease: 'none', repeat: -1 });
    (function morph() {
      var r = function () { return gsap.utils.random(38, 72) + '%'; };
      gsap.to(blob, {
        borderRadius: r() + ' ' + r() + ' ' + r() + ' ' + r() + ' / ' + r() + ' ' + r() + ' ' + r() + ' ' + r(),
        duration: 2.4, ease: 'sine.inOut', onComplete: morph
      });
    })();
  }

  /* Menu: cream panel wipes down from the top, side photo wipes up from
     the bottom, then each row rises in, staggered (timings sampled from
     the reference). Closing plays it back in reverse, a bit faster. */
  var menu = document.getElementById('site-menu');
  var burger = document.querySelector('.burger');
  var rows = gsap.utils.toArray('.menu-list > li');
  var rowLinks = rows.map(function (li) { return li.firstElementChild; });
  gsap.set(rows, { opacity: 0 });
  gsap.set(rowLinks, { y: 50 });
  var menuTl = gsap.timeline({ paused: true,
    onReverseComplete: function () { gsap.set(menu, { visibility: 'hidden' }); }
  })
    .set(menu, { visibility: 'visible' })
    .to(menu, { clipPath: 'polygon(0% 0%, 100% 0%, 100% 100%, 0% 100%)', duration: 0.95, ease: 'power2.inOut' }, 0)
    .to('.menu-side', { clipPath: 'polygon(0% 100%, 100% 100%, 100% 0%, 0% 0%)', duration: 1.0, ease: 'power3.out' }, 0.45)
    .to(rows, { opacity: 1, duration: 0.55, ease: 'power2.out', stagger: 0.12 }, 0.45)
    .to(rowLinks, { y: 0, duration: 0.55, ease: 'power2.out', stagger: 0.12 }, 0.45);

  function setMenu(open) {
    document.documentElement.classList.toggle('menu-open', open);
    burger.setAttribute('aria-expanded', open);
    burger.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    if (open) { menuTl.timeScale(1).play(); if (window.lenis) window.lenis.stop(); }
    else { menuTl.timeScale(1.6).reverse(); if (window.lenis) window.lenis.start(); }
  }
  burger.addEventListener('click', function () { setMenu(!document.documentElement.classList.contains('menu-open')); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && document.documentElement.classList.contains('menu-open')) setMenu(false); });
  menu.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', function () { setMenu(false); }); });

  var subBtn = menu.querySelector('button[aria-controls="sub-treatments"]');
  subBtn.addEventListener('click', function () {
    var open = subBtn.getAttribute('aria-expanded') !== 'true';
    subBtn.setAttribute('aria-expanded', open);
    document.getElementById('sub-treatments').classList.toggle('open', open);
  });

  /* Hero video: fetched whole as a blob (CF Workers ignores Range
     requests), play() called immediately for iOS, then scrubbed by
     scroll progress with light smoothing. */
  var video = document.querySelector('.hero-video');
  var poster = document.querySelector('.hero-poster');
  var src = window.innerWidth < 768 ? 'assets/video/hero-mobile.mp4' : 'assets/video/hero.mp4';
  var target = 0, current = 0, ready = false;

  fetch(src).then(function (r) { return r.blob(); }).then(function (blob) {
    video.src = URL.createObjectURL(blob);
    var unlocked = false;
    var finish = function () {
      if (unlocked) return; unlocked = true;
      video.pause(); ready = true;
      video.currentTime = target * (video.duration || 0);
      gsap.to(poster, { opacity: 0, duration: 0.6, onComplete: function () { poster.style.display = 'none'; } });
    };
    video.addEventListener('playing', finish, { once: true });
    video.play().catch(function () {});
    setTimeout(finish, 600);
  }).catch(function () {});

  ScrollTrigger.create({
    trigger: '.hero', start: 'top top', end: 'bottom bottom',
    onUpdate: function (self) { target = self.progress; }
  });

  gsap.ticker.add(function () {
    if (!ready || !video.duration) return;
    current += (target - current) * 0.12;
    var t = current * (video.duration - 0.05);
    if (Math.abs(video.currentTime - t) > 0.01) video.currentTime = t;
  });
})();
</script>
</body>
</html>
