<script data-page>
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* leaves fade in as the title lines land (reference: 0.35s, l-=.55 / l-=.5) */
  gsap.to('.ls_ttl .leaf01', { opacity: 1, duration: 0.35, delay: 1.3, ease: 'none', scrollTrigger: { trigger: '.ls_ttl', start: 'top bottom-=200' } });
  gsap.to('.ls_ttl .leaf02', { opacity: 1, duration: 0.35, delay: 1.35, ease: 'none', scrollTrigger: { trigger: '.ls_ttl', start: 'top bottom-=200' } });
  if (!reduce) gsap.from('.contacts_b .ln', { scaleX: 0, duration: 1.4, ease: 'power2.inOut', delay: 0.4 });

  /* arriving from a gift card / membership button: prefill the message */
  var p = new URLSearchParams(location.search), g = p.get('gift'), msg = document.getElementById('c-msg');
  if (g) {
    var t = (window.AURELIA_TREATMENTS || []).filter(function (x) { return x.slug === g; })[0];
    var text = /^balance-/.test(g) ? 'I would like to buy a $' + Number(g.split('-')[1]).toLocaleString('en-US') + ' Aurelia gift balance (' + (p.get('format') || 'E-gift card') + ').'
      : g === 'glow-club' ? 'I would like to join the Glow Club membership.'
      : g === 'golden-club' ? 'I would like to join the Golden Club membership.'
      : t ? 'I would like to buy a gift card for ' + t.full + '.' : '';
    if (text) msg.value = text;
  }

  /* Form: validate, then send to the endpoint in data-endpoint (Formspree)
     when one is set; until then it shows the thank-you state */
  var form = document.querySelector('.f1');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var bad = [].filter.call(form.querySelectorAll('[required]'), function (el) { return !el.value.trim() || (el.type === 'email' && !/^\S+@\S+\.\S+$/.test(el.value)); });
    form.querySelectorAll('.rows').forEach(function (r) { r.style.borderColor = ''; });
    if (bad.length) { bad.forEach(function (el) { el.closest('.rows').style.borderColor = '#b4553f'; }); bad[0].focus(); return; }
    var done = function () { document.querySelector('.big_form').classList.add('sent'); if (window.ScrollTrigger) ScrollTrigger.refresh(); };
    var ep = form.dataset.endpoint;
    if (!ep) { done(); return; }
    fetch(ep, { method: 'POST', headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }, body: JSON.stringify(Object.fromEntries(new FormData(form))) })
      .then(done).catch(done);
  });
})();
</script>
